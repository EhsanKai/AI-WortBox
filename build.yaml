targets:
  $default:
    builders:
      drift_dev:
        options:
          # Store DateTime values as ISO-8601 text. All timestamps are written in
          # UTC so that lexicographic comparisons (e.g. due dates) stay correct.
          store_date_time_values_as_text: true
          databases:
            app_database: lib/data/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
